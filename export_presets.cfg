[preset.0.options]

gradle_build/use_gradle_build=false
gradle_build/target_sdk="33"
version/code=1
version/name="0.1"
package/unique_name="com.idlerpg.game"
package/name="Idle RPG"
package/signed=true
screen/immersive_mode=true

; No keystore/debug* override here on purpose: the barichello/godot-ci
; image bakes a working debug keystore into its global Editor Settings,
; and with HOME=/root set for the export step (see android-build.yml),
; Godot now finds those settings correctly. An earlier attempt to also
; set keystore/debug* explicitly here conflicted with that (Godot only
; saw some of the three keystore/user/password fields as set) and broke
; the build -- leaving this blank lets the image's own config resolve it.
