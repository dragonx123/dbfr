[preset.0.options]

; Switched to the Gradle build path. The simpler "legacy" (pre-built
; APK) path hit a reproducible Godot bug in this patch version: a
; build-tools/target-SDK mismatch prints a graceful fallback message but
; still blocks export with an EMPTY error body, and legacy mode won't
; let us override target_sdk to dodge it ("Target SDK can only be
; overridden when Use Gradle Build is enabled" -- confirmed by CI).
; Gradle mode requires a res://android/build folder, which the CI
; workflow generates from the image's bundled android_source.zip before
; export (see .github/workflows/android-build.yml).
gradle_build/use_gradle_build=true
version/code=1
version/name="0.1"
package/unique_name="com.idlerpg.game"
package/name="Idle RPG"
package/signed=true
screen/immersive_mode=true

; No keystore/debug* override here on purpose: the barichello/godot-ci
; image bakes a working debug keystore into its global Editor Settings,
; and with HOME=/root set for the export step (see android-build.yml),
; Godot now finds those settings correctly. An earlier attempt to also
; set keystore/debug* explicitly here conflicted with that (Godot only
; saw some of the three keystore/user/password fields as set) and broke
; the build -- leaving this blank lets the image's own config resolve it.
