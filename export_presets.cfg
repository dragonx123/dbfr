[preset.0.options]

gradle_build/use_gradle_build=false
version/code=1
version/name="0.1"
package/unique_name="com.idlerpg.game"
package/name="Idle RPG"
package/signed=true
screen/immersive_mode=true

# Explicit debug keystore, so export doesn't depend on Godot's global
# Editor Settings finding it (which is what broke in CI — see
# .github/workflows/android-build.yml for why). This is the standard
# Android debug keystore path/credentials baked into the barichello/
# godot-ci image; not a secret — every Android debug keystore uses these
# same well-known defaults.
keystore/debug="/root/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
